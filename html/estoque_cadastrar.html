<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/config.js"></script>
    <script src="../js/estoque_cadastrar.js" defer></script>
    <title>Movimentação de Estoque</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <span class="titulo_menu">Estoque</span>&emsp;
            <a href="./estoque_cadastrar.html">Registrar Movimento</a>&emsp;
            <a href="./estoque_listar.html">Histórico de Estoque</a>&emsp;
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Registrar Movimento de Estoque</h1>
        <br><br>
        <form>
            <label for="idUsuario">Código do Usuário</label><br>
            <input type="number" id="idUsuario" required><br><br>

            <label for="idProduto">Código do Produto</label><br>
            <input type="number" id="idProduto" required><br><br>

            <label for="tipo">Tipo de Movimento</label><br>
            <select id="tipo" required>
                <option value="ENTRADA">ENTRADA</option>
                <option value="SAIDA">SAÍDA</option>
            </select><br><br>

            <label for="qtdeMov">Quantidade Movimentada</label><br>
            <input type="number" id="qtdeMov" min="1" required><br><br>

            <label for="data">Data do Movimento</label><br>
            <input type="date" id="data" required><br><br>

            <button id="btn_cadastrar">Registrar Movimento</button><br><br><br>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
